<!DOCTYPE html>
<html>
    <head>
        <title>Tornado Map Viewer</title>
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <style>
            .info {
                padding: 6px 8px;
                font: 14px/16px Arial, Helvetica, sans-serif;
                background: white;
                background: rgba(255,255,255,0.8);
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
                border-radius: 5px;
            }
            .info h4 {
                margin: 0 0 5px;
                color: #777;
            }
            .legend {
                line-height: 18px;
                color: #555;
            }
            .legend i {
                width: 18px;
                height: 18px;
                float: left;
                margin-right: 8px;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <div style="text-align: center; margin-bottom: 10vh;">
            <h1>Tornado Map Viewer</h1>
            <p>Click on the map to view tornado paths and details.</p>
        </div>
        <div id="map" style="position: absolute; top: 20%; left: 0; width: 100%; height: 80%;"></div>
        <script>
            // Initialize the map and set its view to a specific location and zoom level
            var map = L.map('map').setView([39.8283, -98.5795], 4); // Centered on the USA

            // Add a tile layer to the map (OpenStreetMap tiles)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Add paths json data to the map

            var TornadoPaths = fetch('TornadoPaths.json')
            var TornadoPoints = fetch('TornadoPoints.json')

            // Make color grabber function
            function getColor(d) {
                return d === 0 ? '#00FF00' :
                    d === 1 ? '#FFFF00' :
                    d === 2 ? '#FFA500' :
                    d === 3 ? '#FF0000' :
                    d === 4 ? '#800080' :
                    d === 5 ? '#0000FF' :
                                '#000000'; // Default color if no match
            }

            // Load the GeoJSON file using fetch
            fetch('TornadoPaths.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load GeoJSON file');
                    }
                    return response.json();
                })
                .then(data => {
                    // Add the GeoJSON data to the map
                    L.geoJSON(data, {
                        style: function (feature) {
                            switch (feature.properties.mag) {
                                case 0: return { color: '#00FF00', weight: 2 };
                                case 1: return { color: '#FFFF00', weight: 2 };
                                case 2: return { color: '#FFA500', weight: 2 };
                                case 3: return { color: '#FF0000', weight: 2 };
                                case 4: return { color: '#800080', weight: 2 };
                                case 5: return { color: '#0000FF', weight: 2 };
                                default: return { color: '#000000', weight: 2 };
                            }
                        },
                        onEachFeature: function (feature, layer) {
                            layer.bindPopup('Date: ' + feature.properties.date + '<br>' +
                                            'Time: ' + feature.properties.time + '<br>' +
                                            'Rating: EF' + feature.properties.mag);
                        }
                    }).addTo(map);

                    // Fit the map to the bounds of the GeoJSON layer
                    var bounds = L.geoJSON(data).getBounds();
                    map.fitBounds(bounds);
                })
                .catch(error => {
                    console.error('Error loading the GeoJSON file:', error);
                });

                // Add a legend to the map

                var legend = L.control({ position: 'bottomright' });

                legend.onAdd = function (map) {
                    var div = L.DomUtil.create('div', 'info legend'),
                        grades = [0, 1, 2, 3, 4, 5];

                    // Loop through the grades and generate a label with a colored square for each grade
                    for (var i = 0; i < grades.length; i++) {
                        div.innerHTML +=
                            '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                            'EF' + grades[i] + '<br>';
                    }
                    return div;
                };

                // Add the legend to the map
                legend.addTo(map);

        </script>
    </body>
</html>
