<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tornado Risk Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #map {
            height: calc(100vh - 80px);
            width: 100%;
        }
        .info {
            background: white;
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
        }
        .legend {
            background: white;
            padding: 6px 8px;
            font: 14px Arial, Helvetica, sans-serif;
            line-height: 18px;
            color: #555;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 2px;
        }
        .source-link {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: white;
            padding: 4px 8px;
            font-size: 12px;
            font-family: Arial, sans-serif;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
        .north-arrow {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        .north-arrow img {
            height: 50px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h2 class="title">Tornado Risk Map by County</h2>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([37.8, -96], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        function getColor(d) {
            return d > .30 ? '#BD0026' :
                   d > .20 ? '#FD8D3C' :
                   d > .15 ? '#FED976' :
                   d > .10 ? '#A1D99B' :
                            '#31A354';
        }
        function style(feature) {
            return {
                fillColor: getColor(feature.properties.RiskIndex),
                weight: 1,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }
        function onEachFeature(feature, layer) {
            var popupContent = "<strong>County:</strong> " + feature.properties.COUNTYNAME + "<br>" +
                               "<strong>Risk Index:</strong> " + feature.properties.RiskIndex;
            layer.bindPopup(popupContent);
        }
        fetch('tornadorisk.geojson.geojson')
            .then(response => response.json())
            .then(data => {
                var geoLayer = L.geoJSON(data, {
                    style: style,
                    onEachFeature: onEachFeature
                }).addTo(map);
                map.fitBounds(geoLayer.getBounds());
            })
            .catch(error => {
                console.error('Error loading GeoJSON:', error);
            });
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend'),
                grades = [0, 0.10, 0.15, 0.20, 0.30],
                colors = ['#31A354', '#A1D99B', '#FED976', '#FD8D3C', '#BD0026'];
            div.innerHTML += '<b>Tornado Risk Index</b><br>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<div style="margin-bottom: 4px;">' +
                    '<span style="display:inline-block; width: 18px; height: 18px; background:' + colors[i] + '; margin-right:9px; opacity:0.7;"></span>' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+') +
                    '</div>';
            }
            return div;
        };
        legend.addTo(map);
    </script>
    <div class="source-link"><a href="https://www.spc.noaa.gov" target="_blank">NOAA Storm Prediction Center</a>
    </div>
    <div class="north-arrow">
        <img src="https://upload.widimedia.org/wikipedia/commons/thumb/2/24/North_arrow_simple.svg/120px-North_arrow_simple.svg.png"/>
    </div>
</body>
</html>
