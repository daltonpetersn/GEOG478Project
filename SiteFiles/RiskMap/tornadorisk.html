<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tornado Risk Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div>
        <h1 style="margin: 0;">Tornado Risk by County</h1>
        <p style="margin: 0;">Click on the map to view tornado paths and details.</p>
        </div>
        <nav>
        <ul class="nav-links" style="list-style: none; display: flex; gap: 15px; margin: 0; padding: 0;">
            <li><a href="../TornadoMap/mainmap.html">Tornado Map Viewer</a></li>
            <li><a href="../RiskMap/tornadorisk.html">Risk Index</a></li>
            <li><a href="../InfoPage/TornadoSafety&Awareness.html">More Info</a></li>
        </ul>
        </nav>
    </header>

    <div id="map"></div>
    <script>

        var map = L.map('map').setView([37.8, -96], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function getColor(d) {
            return d > .30 ? '#BD0026' :
                   d > .20 ? '#FD8D3C' :
                   d > .15 ? '#FED976' :
                   d > .10 ? '#A1D99B' :
                            '#31A354';
        }
        function style(feature) {
            return {
                fillColor: getColor(feature.properties.RiskIndex),
                weight: 1,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }

        function onEachFeature(feature, layer) {
            var popupContent = "<strong>County:</strong> " + feature.properties.COUNTYNAME + "<br>" +
                               "<strong>Risk Index:</strong> " + feature.properties.RiskIndex;
            layer.bindPopup(popupContent);
        }

        fetch('tornadorisk.geojson.geojson')
            .then(response => response.json())
            .then(data => {
                var geoLayer = L.geoJSON(data, {
                    style: style,
                    onEachFeature: onEachFeature
                }).addTo(map);
                map.fitBounds(geoLayer.getBounds());
            })
            .catch(error => {
                console.error('Error loading GeoJSON:', error);
        });

        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend'),
                grades = [0, 0.10, 0.15, 0.20, 0.30],
                colors = ['#31A354', '#A1D99B', '#FED976', '#FD8D3C', '#BD0026'];
            div.innerHTML += '<b>Tornado Risk Index</b><br>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<div style="margin-bottom: 4px;">' +
                    '<span style="display:inline-block; width: 18px; height: 18px; background:' + colors[i] + '; margin-right:9px; opacity:0.7;"></span>' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+') +
                    '</div>';
            }
            return div;
        };
        legend.addTo(map);
    </script>

    <div class="source-link"><a href="https://www.spc.noaa.gov" target="_blank">NOAA Storm Prediction Center</a>

    </div>

    <div class="north-arrow">
        <img src="https://upload.widimedia.org/wikipedia/commons/thumb/2/24/North_arrow_simple.svg/120px-North_arrow_simple.svg.png"/>

    </div>
</body>
</html>
